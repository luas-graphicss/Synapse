




name = "aurora-relay"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true



[observability]
enabled = false


[[durable_objects.bindings]]
name = "SESSOES"
class_name = "RelaySessao"








[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySessao"]

[[migrations]]
tag = "v2"

[[migrations]]
tag = "v3"

[vars]
PLANO = "free"
LIMITE_DIA = "300000"
LIMITE_MIN = "6000"
ORIGENS_PERMITIDAS = ""
FETCH_HOSTS = ""















RESERVAS = "https://aurora-relay.mcp-reserva.workers.dev, https://aurora-relay.palelovoy40.workers.dev"










RESERVA_HINT = ""












[env.synapse-mcp]
name = "synapse-mcp"
workers_dev = true

[env.synapse-mcp.observability]
enabled = false

[[env.synapse-mcp.durable_objects.bindings]]
name = "SESSOES"
class_name = "RelaySessao"

[[env.synapse-mcp.migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySessao"]

[env.synapse-mcp.vars]
PLANO = "free"
LIMITE_DIA = "300000"
LIMITE_MIN = "6000"
RESERVAS = "https://aurora-relay.pedrinnieeva.workers.dev, https://aurora-relay.mcp-reserva.workers.dev, https://aurora-relay.palelovoy40.workers.dev"
RESERVA_HINT = ""
