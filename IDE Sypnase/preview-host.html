<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex" />
		<title>Synapse · preview isolado</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #fff;
				overflow: hidden;
			}
			iframe {
				border: 0;
				width: 100%;
				height: 100%;
				display: block;
				background: #fff;
			}
			iframe[data-pendente] {
				position: absolute;
				inset: 0;
				visibility: hidden;
				pointer-events: none;
			}
			.aviso {
				font: 14px/1.5 system-ui, sans-serif;
				color: #3a4252;
				padding: 32px;
				max-width: 520px;
			}
			.aviso h1 {
				font-size: 16px;
				margin: 0 0 8px;
			}
			.aviso code {
				background: #eef1f6;
				padding: 1px 5px;
				border-radius: 4px;
			}
		</style>
	</head>
	<body>
		<script src="/preview-boot.js"></script>
	</body>
</html>
